name: IOS CICD

on:
  push:
    branches: [ "main", "dev" ]
  pull_request:
    branches: [ "main", "dev" ]

jobs:

  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Run Unit Tests
        run: chmod +x ./gradlew && ./gradlew testDebugUnitTest

  build:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build iOS Framework
        run: ./gradlew :composeApp:linkDebugFrameworkIos

      - name: Create IPA file
        run: |
          mkdir -p output/ios
          xcodebuild -create-xcframework \
            -framework composeApp/build/bin/iosX64/debugFramework/composeApp.framework \
            -output output/ios/composeApp.xcframework

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v3
        with:
          name: KloudIOS
          path: output/ios/
